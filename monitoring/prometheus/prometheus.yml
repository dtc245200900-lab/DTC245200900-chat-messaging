global:
  scrape_interval: 15s
scrape_configs:
  - job_name: chat-app
    metrics_path: /metrics
    static_configs:
      - targets: [nginx:80]
  - job_name: postgres
    static_configs:
      - targets: [postgres-exporter:9187]
  - job_name: containers
    static_configs:
      - targets: [cadvisor:8080]
