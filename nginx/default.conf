limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
server { listen 80; server_name _; server_tokens off; client_max_body_size 32k;
 resolver 127.0.0.11 valid=10s;
 add_header X-Content-Type-Options nosniff always;
 add_header X-Frame-Options DENY always;
 add_header Referrer-Policy no-referrer always;
 location /api/ { limit_req zone=api_limit burst=20 nodelay; proxy_pass http://app:3000; proxy_set_header Host $host; }
 location /socket.io/ { proxy_pass http://app:3000/socket.io/; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; proxy_read_timeout 86400; }
 location /health { proxy_pass http://app:3000/health; }
 location /metrics { allow 172.16.0.0/12; allow 10.0.0.0/8; deny all; proxy_pass http://app:3000/metrics; }
 location /pgadmin/ { set $pgadmin_upstream pgadmin; proxy_pass http://$pgadmin_upstream/; proxy_set_header X-Script-Name /pgadmin; proxy_set_header Host $host; }
 location /grafana/ {
  proxy_pass http://grafana:3000/grafana/;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-Host $host;
 }
 location / { proxy_pass http://app:3000; }
}
